<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
  <title>NainTail</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="host-home" data-host-home>
    <div class="edge-rail edge-rail-left" data-fixed-edge="left" aria-hidden="true"></div>
    <div class="edge-rail edge-rail-right" data-fixed-edge="right" aria-hidden="true"></div>
    <section class="launcher" aria-label="설치된 애드온 런처">
      <button id="previousAddon" class="deck-arrow prev" type="button" aria-label="이전 애드온">‹</button>
      <div id="deckViewport" class="deck-viewport">
        <ol id="deckTrack" class="deck-track" aria-label="설치된 애드온"></ol>
      </div>
      <button id="nextAddon" class="deck-arrow next" type="button" aria-label="다음 애드온">›</button>

      <button id="emptyAddonInstall" class="empty-addon-install" type="button" aria-label="공식 애드온 추가" hidden>
        <span aria-hidden="true">+</span>
      </button>

      <footer class="deck-footer">
        <span id="deckIndex" class="deck-index">—</span>
        <span class="key-hints"><b>←→ · 휠</b></span>
        <span class="host-action-stack">
          <button id="openAddonInstaller" class="host-addon-button" type="button" aria-label="공식 애드온 추가" title="공식 애드온 추가">+</button>
          <button id="openSettings" class="host-settings-button" type="button" aria-label="호스트 설정" title="호스트 설정">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/>
              <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.94 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.57 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.94a1.7 1.7 0 0 0-.34-1.88L4.2 7a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.57h.01A1.7 1.7 0 0 0 10 3.01V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06A2 2 0 1 1 19.8 7l-.06.06A1.7 1.7 0 0 0 19.4 9v.01A1.7 1.7 0 0 0 20.99 10H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z"/>
            </svg>
          </button>
        </span>
      </footer>
    </section>
  </main>

  <header class="host-brand">
    <h1 class="host-title"><span class="host-mark">N</span>NainTail</h1>
    <p class="host-kicker">PORTABLE CREATIVE HOST</p>
  </header>

  <dialog id="settingsDialog" aria-labelledby="settingsTitle">
    <div class="dialog-body">
      <header class="dialog-head">
        <div>
          <h2 id="settingsTitle">호스트 설정</h2>
          <p>모든 Hosted 애드온이 함께 사용하는 NainTail 설정</p>
        </div>
        <button class="dialog-close" type="button" data-close-dialog aria-label="닫기">×</button>
      </header>
      <section class="settings-section" aria-labelledby="outputSettingsTitle">
        <h3 id="outputSettingsTitle">공용 출력 폴더 <span id="outputMode" class="mode-chip">불러오는 중</span></h3>
        <p>Hosted 애드온 결과를 애드온별 하위 폴더에 모은다.</p>
        <div class="path-row">
          <code id="outputPath" class="path-display">불러오는 중…</code>
          <button id="openOutputFolder" type="button">폴더 열기</button>
        </div>
        <div class="settings-actions">
          <button id="selectOutputFolder" type="button">위치 변경</button>
          <button id="resetOutputFolder" class="subtle" type="button" disabled>기본 위치로 복원</button>
        </div>
      </section>
    </div>
  </dialog>

  <dialog id="installerDialog" aria-labelledby="installerTitle">
    <div class="dialog-body">
      <header class="dialog-head">
        <div>
          <h2 id="installerTitle">애드온 추가</h2>
          <p>공식 최신 릴리즈에서 설치할 애드온을 선택한다.</p>
        </div>
        <button class="dialog-close" type="button" data-close-dialog aria-label="닫기">×</button>
      </header>
      <section class="installer-content" aria-live="polite">
        <div id="installerLoading" class="installer-loading">공식 릴리즈를 확인하는 중…</div>
        <div id="officialAddonList" class="official-addon-list"></div>
      </section>
    </div>
  </dialog>

  <div id="launchVeil" class="launch-veil" aria-hidden="true">
    <div id="veilMark" class="veil-mark">N</div>
    <div id="veilTitle" class="veil-title">애드온 실행 중…</div>
    <div class="veil-copy">호스트가 애드온 화면을 준비하고 있다</div>
  </div>
  <p id="hostNotice" class="toast" role="status" aria-live="polite"></p>

  <script src="./app.js"></script>
</body>
</html>
